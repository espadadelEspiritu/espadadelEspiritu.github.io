<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto de Venta - Fundas</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

<!-- HEADER -->
<div class="p-4 flex gap-2">
  <button id="btnNuevaVenta" class="bg-green-600 text-white px-4 py-2 rounded">
    Nueva venta
  </button>

  <button id="btnPDF" class="bg-blue-600 text-white px-4 py-2 rounded">
    PDF del día
  </button>
</div>

<!-- CONTENIDO -->
<div id="listaVentas" class="p-4 grid gap-4"></div>

<!-- FOOTER -->
<div class="p-4 bg-white shadow-inner flex justify-between">
  <div>
    <p class="text-sm text-gray-500">Total del día</p>
    <p id="totalDia" class="text-xl font-bold text-blue-600">$0</p>
  </div>
</div>

<!-- MODAL -->
<dialog id="modal" class="rounded-xl p-6 w-96 shadow-xl relative">

  <button id="btnCerrar" class="absolute top-2 right-3 text-xl">✕</button>

  <h2 class="font-bold mb-2">Agregar producto</h2>

  <input id="inputProducto" type="text"
    placeholder="Ej: funda iPhone 150  |  2 fundas 120"
    class="w-full p-2 border rounded mb-2"
  >

  <p id="preview" class="text-sm text-blue-500 mb-2"></p>

  <p>Total: <span id="totalVenta">$0</span></p>

  <button id="btnFinalizar" class="w-full mt-3 bg-red-500 text-white py-2 rounded">
    Finalizar venta
  </button>

</dialog>

<script src="app.js"></script>

</body>
</html>
